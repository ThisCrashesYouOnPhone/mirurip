[[redirects]]
  from = "/api/exchange-token"
  to = "/.netlify/functions/exchange-token"
  status = 200

[[redirects]]
  from = "/exchange-token"
  to = "/.netlify/functions/exchange-token"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  VITE_DEPLOY_PLATFORM = "NETLIFY"
